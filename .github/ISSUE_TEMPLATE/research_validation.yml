name: Research validation
description: Submit a hypothesis, a check, or a result for review and recording.
title: "[Validation] "
labels:
  - research
body:
  - type: markdown
    attributes:
      value: |
        Use this form to propose a hypothesis, submit an independent check of an
        existing claim, or record a result. State the evidence level honestly at
        the highest level **actually** established — do not round up, and do not
        claim a higher rung of the proof ladder than the evidence supports.

        Passing one rung of the ladder never implies the next.

  - type: textarea
    id: hypothesis
    attributes:
      label: Hypothesis
      description: What is being claimed or tested? State it precisely enough that it could be falsified.
    validations:
      required: true

  - type: textarea
    id: source_evidence
    attributes:
      label: Source / evidence
      description: The evidence this is based on, and where it comes from. Reference artifacts by identity rather than attaching proprietary ones.
    validations:
      required: true

  - type: textarea
    id: artifact_identity
    attributes:
      label: Artifact identity
      description: Identify the artifacts involved precisely — hashes, sizes, structural identifiers, or other unambiguous identifiers. Do not include the artifacts themselves if they are proprietary or restricted.
    validations:
      required: true

  - type: textarea
    id: independent_check
    attributes:
      label: Independent check performed
      description: Describe the check. What produced the reference, and is it genuinely independent of the thing under test?
    validations:
      required: true

  - type: textarea
    id: result
    attributes:
      label: Result
      description: What the check produced. Include the outcome even if it contradicts the hypothesis.
    validations:
      required: true

  - type: dropdown
    id: evidence_level
    attributes:
      label: Evidence level
      description: The highest level actually established. Do not round up.
      options:
        - PROPOSED
        - HOST_STATIC
        - HOST_VALIDATED
        - HOST_INDEPENDENT_ORACLE
        - PHYSICAL_DIAGNOSTIC
        - PHYSICAL_ONE_WORKGROUP
        - PHYSICAL_MULTI_WORKGROUP
        - COMPLETE_JOB
        - INTEROP
        - PRESENTED_FRAME
        - TEMPORAL
        - PERFORMANCE
    validations:
      required: true

  - type: checkboxes
    id: independence_confirmation
    attributes:
      label: Independence confirmation
      options:
        - label: The independent check is genuinely independent — it was not derived from, generated by, or validated against the thing under test.
          required: true
