name: Publication audit

# Periodic and on-demand audit of what is actually tracked.
#
# This gate asks "did anything get committed that should not have?"
# It scans the committed tree for secrets, personal paths, prohibited
# artifact categories, oversized files, and manifest drift.
#
# Host-only. No GPU, no proprietary data, no secrets, no deployment.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Tracked-tree audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Audit working tree
        run: python scripts/verify_publication.py

      - name: Audit committed blob (HEAD)
        run: python scripts/verify_publication.py --git-head

      - name: Confirm no personal git identity leaked
        run: |
          email=$(git log -1 --format='%ae')
          echo "committer email: \${email}"
          case "$email" in
            *users.noreply.github.com) echo "OK: no-reply address" ;;
            *) echo "FAIL: commit metadata carries a non-noreply address"; exit 1 ;;
          esac

      - name: Confirm CI contains no GPU execution command
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys
          import yaml

          workflow = pathlib.Path(".github/workflows/ci.yml")
          data = yaml.safe_load(workflow.read_text(encoding="utf-8"))
          forbidden = re.compile(r"(?i)(^|[^A-Za-z0-9_])(hip(?:cc|run)?|rocm|gfx1030|watchdog|tdr)([^A-Za-z0-9_]|$)")
          hits = []

          for job_name, job in (data.get("jobs") or {}).items():
              for index, step in enumerate(job.get("steps") or [], start=1):
                  run = step.get("run")
                  if not isinstance(run, str):
                      continue
                  for line_no, line in enumerate(run.splitlines(), start=1):
                      if forbidden.search(line):
                          hits.append(
                              f"job={job_name} step={index} run-line={line_no}: {line.strip()}"
                          )

          if hits:
              print("FAIL: GPU-related command token found in CI run commands")
              for hit in hits:
                  print("  ", hit)
              sys.exit(1)

          print("OK: CI run commands contain no GPU execution token")
          PY
