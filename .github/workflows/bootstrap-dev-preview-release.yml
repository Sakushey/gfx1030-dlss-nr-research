name: Bootstrap development preview release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-dev-preview-release.yml"

permissions:
  contents: write

jobs:
  create-prerelease:
    name: Create source-only development prerelease
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7

      - name: Create or refresh v0.0.1 development prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: v0.0.1-dev-preview
          TITLE: Development Preview 0.0.1 — gfx1030 Neural-Rendering Research
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.request

          repo = os.environ["REPO"]
          token = os.environ["GITHUB_TOKEN"]
          tag = os.environ["TAG"]
          title = os.environ["TITLE"]
          notes = pathlib.Path("docs/release-notes-v0.0.1-dev-preview.md").read_text(encoding="utf-8")

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "gfx1030-dlss-nr-research-release-bootstrap",
          }

          payload_obj = {
              "tag_name": tag,
              "target_commitish": "main",
              "name": title,
              "body": notes,
              "draft": False,
              "prerelease": True,
              "generate_release_notes": False,
          }

          check = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/releases/tags/{tag}",
              headers=headers,
          )
          try:
              with urllib.request.urlopen(check) as response:
                  existing = json.load(response)
              release_id = existing["id"]
              payload = json.dumps(
                  {
                      "name": title,
                      "body": notes,
                      "draft": False,
                      "prerelease": True,
                  }
              ).encode("utf-8")
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/releases/{release_id}",
                  data=payload,
                  headers=headers,
                  method="PATCH",
              )
              action = "Refreshed"
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              payload = json.dumps(payload_obj).encode("utf-8")
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/releases",
                  data=payload,
                  headers=headers,
                  method="POST",
              )
              action = "Created"

          with urllib.request.urlopen(request) as response:
              release = json.load(response)

          print(f"{action} prerelease: {release['html_url']}")
          PY